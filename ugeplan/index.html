<title>Drengenes Ugeplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column like a fridge chart; week bar on top, one card per boy, parent editor at the bottom */
:root {
  --bg: #eef2f6;
  --surface: #ffffff;
  --fg: #1b2633;
  --muted: #5d6b7a;
  --line: #d5dde6;
  --emil: #2f6fd6;
  --valdemar: #1f8a5b;
  --gustav: #d4651c;
  --done-fg: #ffffff;
  --danger: #b8322a;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121820; --surface: #1b232e; --fg: #e8eef5; --muted: #9aa8b7; --line: #2c3744;
    --emil: #6aa0ff; --valdemar: #4cc48d; --gustav: #f29152; --done-fg: #10161d; --danger: #f07a70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121820; --surface: #1b232e; --fg: #e8eef5; --muted: #9aa8b7; --line: #2c3744;
  --emil: #6aa0ff; --valdemar: #4cc48d; --gustav: #f29152; --done-fg: #10161d; --danger: #f07a70;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45; }
.wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 2px 0 0; }

.weekbar { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
.weekbar .label { flex: 1; text-align: center; min-width: 0; }
.weekbar .wk { font-family: var(--display); font-weight: 800; font-size: 1.15rem; }
.weekbar .dates { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.iconbtn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 1.2rem; cursor: pointer; }
.today { font: 600 0.8rem var(--body); color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 2px; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { flex: 1; min-width: 70px; padding: 10px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 600 0.95rem var(--body); cursor: pointer; }
.tab[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.boy { --c: var(--emil); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.boy[data-boy="Valdemar"] { --c: var(--valdemar); }
.boy[data-boy="Gustav"] { --c: var(--gustav); }
.boy header { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.boy .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.boy h2 { font-size: 1.4rem; color: var(--c); }
.who-row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.avatar { width: 52px; height: 52px; flex: none; border-radius: 50%; border: 3px solid var(--c); background: var(--bg); color: var(--c); font: 800 1.3rem var(--display); display: grid; place-items: center; overflow: hidden; padding: 0; position: relative; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
button.avatar { cursor: pointer; }
button.avatar .cam { position: absolute; inset: auto 0 0 0; background: var(--c); color: var(--done-fg); font: 600 0.6rem var(--body); line-height: 1.5; text-transform: uppercase; letter-spacing: .04em; }
.boy h2 .age { font: 500 0.9rem var(--body); color: var(--muted); }
.boy .count { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--c); border-radius: 99px; transition: width .3s ease; }
.allDone { font-weight: 600; color: var(--c); }

ul.tasks { list-style: none; margin: 0; padding: 0; }
ul.tasks li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
ul.tasks li:last-child { border-bottom: 0; }
.tname { flex: 1; min-width: 0; font-weight: 500; }
.tname small { display: block; color: var(--muted); font-weight: 400; font-size: 0.8rem; }
li.complete .tname { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--c); }
.slots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.slot { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--c); background: transparent; color: var(--done-fg); cursor: pointer; display: grid; place-items: center; padding: 0; }
.slot svg { width: 22px; height: 22px; opacity: 0; transform: scale(.6); transition: opacity .15s, transform .15s; }
.slot[aria-pressed="true"] { background: var(--c); }
.slot[aria-pressed="true"] svg { opacity: 1; transform: none; }
.slot:disabled { cursor: default; opacity: .75; }
.empty { padding: 16px; color: var(--muted); }

:focus-visible { outline: 3px solid var(--c, var(--emil)); outline-offset: 2px; }

.note { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; color: var(--muted); font-size: 0.92rem; }

details.edit { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 4px 16px; }
details.edit summary { cursor: pointer; font-family: var(--display); font-weight: 600; font-size: 1.05rem; padding: 10px 0; }
.editlist { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.editlist li { display: flex; align-items: center; gap: 8px; font-size: 0.92rem; }
.editlist .who { font-weight: 600; width: 76px; flex: none; }
.editlist .what { flex: 1; min-width: 0; }
.del { border: 1px solid var(--line); background: none; color: var(--danger); border-radius: 8px; padding: 4px 10px; font: 600 0.8rem var(--body); cursor: pointer; }
form.add { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-bottom: 14px; }
form.add label { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
form.add .full { grid-column: 1 / -1; }
form.add input, form.add select { font: 500 1rem var(--body); padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; }
form.add button { grid-column: 1 / -1; padding: 12px; border-radius: 10px; border: 0; background: var(--fg); color: var(--bg); font: 600 1rem var(--body); cursor: pointer; }
.err { color: var(--danger); font-size: 0.9rem; min-height: 1.2em; margin: 0; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <div>
    <h1>Drengenes Ugeplan</h1>
    <p class="sub">Kryds af når opgaven er lavet. Ugen starter forfra hver mandag.</p>
  </div>

  <div class="weekbar">
    <button class="iconbtn" id="prev" aria-label="Forrige uge">&#8249;</button>
    <div class="label">
      <div class="wk" id="wk">Uge</div>
      <div class="dates" id="dates"></div>
      <button class="today" id="today" hidden>Gå til denne uge</button>
    </div>
    <button class="iconbtn" id="next" aria-label="Næste uge">&#8250;</button>
  </div>

  <div class="tabs" role="group" aria-label="Vis opgaver for">
    <button class="tab" data-f="Alle" aria-pressed="true">Alle</button>
    <button class="tab" data-f="Valdemar" aria-pressed="false">Valdemar</button>
    <button class="tab" data-f="Gustav" aria-pressed="false">Gustav</button>
    <button class="tab" data-f="Emil" aria-pressed="false">Emil</button>
  </div>

  <p class="note" id="status">Henter opgaverne&hellip; Når de er hentet, står hver drengs opgaver her med en boks per gang, opgaven skal laves.</p>

  <div id="boys"></div>

  <details class="edit" id="editor" hidden>
    <summary>Rediger opgaver (forældre)</summary>
    <ul class="editlist" id="editlist"></ul>
    <form class="add" id="addform">
      <label class="full">Opgave
        <input id="f-title" required maxlength="60" placeholder="F.eks. Gå tur med hunden">
      </label>
      <label>Hvem
        <select id="f-boy"><option>Valdemar</option><option>Gustav</option><option>Emil</option></select>
      </label>
      <label>Gange pr. uge
        <select id="f-times"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>7</option></select>
      </label>
      <button type="submit">Tilføj opgave</button>
      <p class="err full" id="f-err"></p>
    </form>
  </details>
</div>

<input type="file" id="photo-input" accept="image/*" hidden>
<script>
(function () {
  // Oldest first; age is computed from the birthday so it stays right
  const BIRTHDAYS = { Valdemar: [2011, 7, 16], Gustav: [2013, 1, 15], Emil: [2016, 11, 11] };
  const BOYS = Object.keys(BIRTHDAYS);
  function age(boy) {
    const [y, m, d] = BIRTHDAYS[boy], now = new Date();
    return now.getFullYear() - y - ((now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d)) ? 1 : 0);
  }
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
  const $ = (id) => document.getElementById(id);

  let db = null, canWrite = false, canEditTasks = false;
  let tasks = [];          // [{id, title, boy, times}]
  let checks = new Set();  // "<taskId>_<slot>" for the shown week
  let photos = {};         // boy -> data URL
  let unsubChecks = null;
  let weekOffset = 0;
  let filter = "Alle";
  try { filter = localStorage.getItem("ugeplan-filter") || "Alle"; } catch (e) {}

  // ISO 8601 week (Monday start)
  function weekInfo(offset) {
    const now = new Date();
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + offset * 7);
    const day = (d.getDay() + 6) % 7;
    const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - day);
    const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
    const thu = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 3);
    const jan4 = new Date(thu.getFullYear(), 0, 4);
    const week = 1 + Math.round(((thu - jan4) / 864e5 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
    const fmt = (x) => x.toLocaleDateString("da-DK", { day: "numeric", month: "short" });
    return { key: thu.getFullYear() + "-W" + String(week).padStart(2, "0"), week, range: fmt(monday) + " – " + fmt(sunday) };
  }

  function setStatus(text) { const s = $("status"); s.textContent = text || ""; s.hidden = !text; }

  function render() {
    const w = weekInfo(weekOffset);
    $("wk").textContent = "Uge " + w.week + (weekOffset === 0 ? " · denne uge" : "");
    $("dates").textContent = w.range;
    $("today").hidden = weekOffset === 0;
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-pressed", String(t.dataset.f === filter)));

    const host = $("boys");
    host.replaceChildren();
    if (!db) return;
    host.style.display = "flex"; host.style.flexDirection = "column"; host.style.gap = "18px";

    for (const boy of BOYS) {
      if (filter !== "Alle" && filter !== boy) continue;
      const mine = tasks.filter((t) => t.boy === boy);
      const total = mine.reduce((n, t) => n + t.times, 0);
      let done = 0;
      mine.forEach((t) => { for (let i = 0; i < t.times; i++) if (checks.has(t.id + "_" + i)) done++; });

      const card = document.createElement("section");
      card.className = "boy"; card.dataset.boy = boy;
      const head = document.createElement("header");
      const row = document.createElement("div"); row.className = "row";
      const h = document.createElement("h2"); h.textContent = boy;
      const a = document.createElement("span"); a.className = "age"; a.textContent = age(boy) + " år";
      h.append(" ", a);
      const c = document.createElement("span"); c.className = "count";
      c.textContent = total && done === total ? "" : done + " af " + total;
      if (total && done === total) { c.className = "allDone"; c.textContent = "Alt klaret!"; }
      const av = document.createElement(canEditTasks ? "button" : "div");
      av.className = "avatar";
      if (photos[boy]) { const img = document.createElement("img"); img.src = photos[boy]; img.alt = boy; av.append(img); }
      else av.textContent = boy[0];
      if (canEditTasks) {
        av.type = "button";
        av.setAttribute("aria-label", (photos[boy] ? "Skift billede af " : "Tilføj billede af ") + boy);
        const cam = document.createElement("span"); cam.className = "cam"; cam.textContent = photos[boy] ? "Skift" : "Billede";
        av.append(cam);
        av.addEventListener("click", () => { photoFor = boy; $("photo-input").value = ""; $("photo-input").click(); });
      }
      const whoRow = document.createElement("div"); whoRow.className = "who-row";
      whoRow.append(av, h);
      row.append(whoRow, c);
      const bar = document.createElement("div"); bar.className = "bar";
      const fill = document.createElement("i"); fill.style.width = total ? (100 * done / total) + "%" : "0";
      bar.append(fill);
      head.append(row, bar);
      card.append(head);

      const ul = document.createElement("ul"); ul.className = "tasks";
      if (!mine.length) {
        const p = document.createElement("li"); p.className = "empty"; p.textContent = "Ingen opgaver endnu.";
        ul.append(p);
      }
      for (const t of mine) {
        const li = document.createElement("li");
        let n = 0;
        const slots = document.createElement("div"); slots.className = "slots";
        for (let i = 0; i < t.times; i++) {
          const k = t.id + "_" + i;
          const on = checks.has(k); if (on) n++;
          const b = document.createElement("button");
          b.className = "slot"; b.innerHTML = CHECK;
          b.setAttribute("aria-pressed", String(on));
          b.setAttribute("aria-label", t.title + (t.times > 1 ? ", gang " + (i + 1) : "") + (on ? " (lavet)" : ""));
          b.disabled = !canWrite;
          b.addEventListener("click", () => toggle(t, i, !on));
          slots.append(b);
        }
        if (n === t.times) li.className = "complete";
        const name = document.createElement("div"); name.className = "tname";
        name.textContent = t.title;
        if (t.times > 1) { const s = document.createElement("small"); s.textContent = n + " af " + t.times + " gange"; name.append(s); }
        li.append(name, slots);
        ul.append(li);
      }
      card.append(ul);
      host.append(card);
    }
    renderEditor();
  }

  function renderEditor() {
    $("editor").hidden = !canEditTasks;
    if (!canEditTasks) return;
    const ul = $("editlist"); ul.replaceChildren();
    for (const t of tasks) {
      const li = document.createElement("li");
      const who = document.createElement("span"); who.className = "who"; who.textContent = t.boy;
      const what = document.createElement("span"); what.className = "what"; what.textContent = t.title + " · " + t.times + "×/uge";
      const del = document.createElement("button"); del.className = "del"; del.type = "button";
      del.textContent = "Slet";
      del.addEventListener("click", () => {
        if (del.dataset.armed) { db.doc("tasks/" + t.id).delete().catch(showErr); }
        else { del.dataset.armed = "1"; del.textContent = "Bekræft"; setTimeout(() => { delete del.dataset.armed; del.textContent = "Slet"; }, 3000); }
      });
      li.append(who, what, del);
      ul.append(li);
    }
  }

  function showErr(e) {
    const msg = e && e.code === "invalid_argument" ? "Du har ikke lov til at ændre dette." : "Det lykkedes ikke at gemme. Prøv igen.";
    setStatus(msg);
  }

  async function toggle(t, slot, on) {
    const w = weekInfo(weekOffset);
    const k = t.id + "_" + slot;
    const ref = db.doc("checks/" + w.key + "_" + k);
    // optimistic
    if (on) checks.add(k); else checks.delete(k);
    render();
    try {
      if (on) await ref.set({ week: w.key, task: t.id, slot, at: new Date().toISOString() });
      else await ref.delete();
    } catch (e) {
      if (on) checks.delete(k); else checks.add(k);
      if (e && e.code === "invalid_argument") canWrite = false;
      render(); showErr(e);
    }
  }

  function subscribeWeek() {
    if (unsubChecks) unsubChecks();
    checks = new Set();
    const key = weekInfo(weekOffset).key;
    unsubChecks = db.collection("checks").where("week", "==", key).onSnapshot((snap) => {
      checks = new Set(snap.docs.map((d) => { const x = d.data(); return x.task + "_" + x.slot; }));
      render();
    }, () => setStatus("Forbindelsen blev afbrudt. Genindlæs siden."));
  }

  // Parent picks a photo; it is cropped to a centred square, shrunk and stored in the shared db
  let photoFor = null;
  $("photo-input").addEventListener("change", async () => {
    const file = $("photo-input").files[0];
    if (!file || !photoFor || !db) return;
    const boy = photoFor;
    try {
      const url = URL.createObjectURL(file);
      const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      const sx = (img.naturalWidth - side) / 2;
      const sy = Math.max(0, (img.naturalHeight - side) / 2 - side * 0.1); // lean up toward the face
      const cv = document.createElement("canvas"); cv.width = cv.height = 192;
      cv.getContext("2d").drawImage(img, sx, sy, side, side, 0, 0, 192, 192);
      URL.revokeObjectURL(url);
      const data = cv.toDataURL("image/jpeg", 0.82);
      photos[boy] = data; render();
      await db.doc("photos/" + boy).set({ img: data, at: new Date().toISOString() });
    } catch (e) { setStatus("Billedet kunne ikke gemmes. Prøv et andet billede."); }
  });

  $("prev").addEventListener("click", () => { weekOffset--; render(); if (db) subscribeWeek(); });
  $("next").addEventListener("click", () => { weekOffset++; render(); if (db) subscribeWeek(); });
  $("today").addEventListener("click", () => { weekOffset = 0; render(); if (db) subscribeWeek(); });
  document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
    filter = t.dataset.f;
    try { localStorage.setItem("ugeplan-filter", filter); } catch (e) {}
    render();
  }));

  $("addform").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const title = $("f-title").value.trim();
    if (!title) return;
    $("f-err").textContent = "";
    try {
      await db.collection("tasks").add({ title, boy: $("f-boy").value, times: Number($("f-times").value), order: Date.now() });
      $("f-title").value = "";
    } catch (e) { $("f-err").textContent = "Opgaven blev ikke gemt. Prøv igen."; }
  });

  render();

  (async function start() {
    const api = window.claude;
    if (!api || !api.use) { setStatus("Åbn siden via linket fra claude.ai for at se opgaverne."); return; }
    const [d, user] = await Promise.all([api.use("db"), api.use("user")]);
    if (!d) { setStatus("Log ind på claude.ai for at se og krydse opgaver af."); return; }
    db = d;
    if (user) {
      const w = await user.can("data.write");
      canWrite = w !== false;
      canEditTasks = (await user.canEdit()) || (await user.isOwner());
    } else { canWrite = true; }
    setStatus(canWrite ? "" : "Du kan se ugeplanen, men ikke krydse af. Bed en forælder om at give dig adgang som Contributor.");
    db.collection("tasks").onSnapshot((snap) => {
      tasks = snap.docs.map((doc) => {
        const x = doc.data();
        return { id: doc.id, title: String(x.title || ""), boy: String(x.boy || ""), times: Math.max(1, Math.min(7, Number(x.times) || 1)), order: Number(x.order) || 0 };
      }).filter((t) => t.title && BOYS.includes(t.boy)).sort((a, b) => a.order - b.order);
      if (!tasks.length && canWrite) setStatus(canEditTasks ? "Der er ingen opgaver endnu. Tilføj den første under Rediger opgaver nederst." : "Der er ingen opgaver endnu.");
      else if (canWrite) setStatus("");
      render();
    }, () => setStatus("Forbindelsen blev afbrudt. Genindlæs siden."));
    db.collection("photos").onSnapshot((snap) => {
      photos = {};
      snap.docs.forEach((d) => { const x = d.data(); if (BOYS.includes(d.id) && typeof x.img === "string" && x.img.startsWith("data:image/")) photos[d.id] = x.img; });
      render();
    }, () => {});
    subscribeWeek();
  })();
})();
</script>
